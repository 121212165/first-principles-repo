# ============================================================
# CI 主流水线 · first-principles-repo
#
# 设计哲学: 三级门禁
#   Job 1 validate —— 硬门禁(机器可判定,失败 => PR 红,不可合并)
#       结构 / ID 唯一 / 层级一致 / 引用完整 / 推导图无环 / 剥离字段规则
#   Job 2 falsify  —— 软门禁(证伪引擎,不阻断,但生成待审清单)
#       剥离词表命中检测 / 穷尽性检查 / 层级错位 / 重叠检测
#   Job 3 comment  —— 报告(把两份结果汇总成 PR 评论,附 json artifact)
#
# 每次 PR / push 自动运行,无需任何人手动触发。
# 准确性三重保障: 机器硬校验 + 机器启发式证伪 + 人类评审清单(见 docs/REVIEW.md)
# ============================================================
name: first-principles-ci

on:
  pull_request:          # 每次 PR(含后续 push)
  push:                  # 直接 push 到主干也跑
    branches: [main, master]
  workflow_dispatch:     # 手动触发(用于全库定期复审)
  schedule:              # 每周日自动全库复审(证伪引擎会随时间漂移)
    - cron: "0 3 * * 0"

permissions:
  contents: read
  pull-requests: write   # 允许给 PR 发评论
  actions: read

jobs:
  # ========================================================
  # Job 1 · 硬门禁:validate
  # ========================================================
  validate:
    name: 硬校验 (结构/引用/层级/推导图)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install pyyaml

      - name: 运行硬校验
        id: validate
        run: |
          python scripts/validate.py . \
            | tee .ci-report/validate-output.txt
          exit ${PIPESTATUS[0]}   # 以 validate.py 的真实退出码为准

      - name: 上传硬校验日志(制品)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validate-output
          path: .ci-report/validate-output.txt
          if-no-files-found: ignore

  # ========================================================
  # Job 2 · 软门禁:falsify(证伪引擎)
  # ========================================================
  falsify:
    name: 证伪引擎 (剥离审计/穷尽性/错位)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install pyyaml

      - name: 运行证伪引擎
        id: falsify
        run: |
          python scripts/falsify.py . \
            | tee .ci-report/falsify-output.txt
          exit 0    # 软门禁永不红 —— 证伪是"报告",不是"封锁"

      - name: 上传剥离审计报告(制品)
        uses: actions/upload-artifact@v4
        with:
          name: peel-audit-report
          path: |
            .ci-report/peel-audit-report.json
            .ci-report/falsify-output.txt
          if-no-files-found: ignore

  # ========================================================
  # Job 3 · 汇总评论(把结论写进 PR,提交者不看 Actions 也能看到)
  # ========================================================
  report:
    name: 汇总报告 (PR 评论)
    runs-on: ubuntu-latest
    needs: [validate, falsify]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install pyyaml

      # 再跑一次以拿到结构化 JSON(便宜,保证时序干净)
      - name: 重新生成报告数据
        id: regen
        run: |
          python scripts/validate.py . >/dev/null 2>&1; echo "hard_exit=$?" >> "$GITHUB_ENV"
          python scripts/falsify.py . >/dev/null 2>&1 || true

      - name: 组装 PR 评论
        id: comment
        run: |
          python - <<'EOF'
          import json, pathlib
          rep = json.loads(pathlib.Path(".ci-report/peel-audit-report.json").read_text(encoding="utf-8"))
          hard = "${HARD_EXIT}" if "${HARD_EXIT}" else "?"
          s = rep["stats"]; sm = rep["summary"]
          lines = []
          lines.append("## 🔍 第一性原理 CI 报告(自动生成)")
          lines.append("")
          lines.append(f"**硬校验(validate.py)**: {'✅ 通过' if hard == '0' else '❌ 失败 —— 不可合并'}")
          lines.append(f"**证伪引擎(falsify.py)**: 公设 {s.get('axiom',0)} 条 | 疑似可推导 {s.get('suspect',0)} | "
                       f"疑似重叠 {s.get('overlap',0)} | 疑似错位 {s.get('misplaced',0)}")
          lines.append("")
          lines.append(f"**剥离通过率**: {sm.get('peel_pass_rate', 'N/A')}")
          lines.append("")
          if rep.get("findings"):
              lines.append("### 待审清单(需逐条回应,见 docs/FALSIFY.md)")
              lines.append("| 级别 | ID | 问题 | 处理 |")
              lines.append("|---|---|---|---|")
              for f in rep["findings"][:20]:
                  lines.append(f"| {f['severity']} | {f['id']} | {f['reason']} | {f['action']} |")
              if len(rep["findings"]) > 20:
                  lines.append(f"| … | 共 {len(rep['findings'])} 条,详见 artifact | | |")
          else:
              lines.append("**本批无待审项** 🎉")
          pathlib.Path("pr-comment.md").write_text("\n".join(lines), encoding="utf-8")
          EOF

      - name: 发布 PR 评论(先删旧评论防刷屏)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('pr-comment.md', 'utf8');
            // 删除本 bot 之前的 CI 评论,避免每个 commit 堆一条
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            for (const c of comments) {
              if (c.body && c.body.includes('第一性原理 CI 报告')) {
                await github.rest.issues.deleteComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: c.id });
              }
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body,
            });

  # ========================================================
  # Job 4 · 全库定期复审(每周日) - 生成全局审计,归档为 artifact
  # ========================================================
  weekly-audit:
    name: 每周全库复审
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: pip install pyyaml
      - name: 全库硬校验 + 证伪
        run: |
          python scripts/validate.py . > .ci-report/weekly-validate.txt 2>&1
          python scripts/falsify.py . > .ci-report/weekly-falsify.txt 2>&1
      - name: 上传周报
        uses: actions/upload-artifact@v4
        with:
          name: weekly-audit
          path: .ci-report/
          if-no-files-found: ignore
