# ============================================================
# peeling-audit.yaml — 剥离审计词表(证伪引擎的数据源)
#
# 用途: falsify.py 用这张表做"疑似可推导"检测:
#   - peel:       本层级内"必须被剥离"的主题(它们是更底层公设的推论,
#                 谁若把它们当 axiom 提交,将被标记 suspect)
#   - must_cover: 本层级的"必覆盖公设"主题(防穷尽性漏洞,缺失则标记 misplaced)
#   - allow_incomplete: 允许该层级暂未覆盖 must_cover(初建期可开)
#
# 依据: 2026-08 四轮审计(226 条 → 合规 194 → 过严击杀 177 → 再击杀 6)
# 维护: 每次证伪挑战成功(某 axiom 被证明可推导)后,把该主题移入 peel。
# ============================================================

layers:
  # ---------------- L1 逻辑与数学 ----------------
  "1":
    peel:            # 必须被剥离(可由更底层推导 / 是定理 / 是定义)
      - "交换律"
      - "结合律"
      - "分配律"
      - "完备性定理"
      - "紧致性定理"
      - "勒文海姆"
      - "超限归纳"
      - "连续统假设"
      - "康托尔定理"
      - "排中律"        # 直觉主义可弃 -> 可选公理,非基石
      - "罗素悖论"      # 是诊断不是原理
      - "公理化集合论"   # 是框架是工具
      - "布尔代数"      # 数学推论/约定
      - "德摩根"
      - "对角化"
    must_cover:
      - "同一性"        # 先于选择的形式核
      - "非平凡性"      # 推理游戏的信息条件
      - "哥德尔"        # 不完备性(作为定理收录,不可绕过)
      - "有穷语法"
    allow_incomplete: false

  # ---------------- L2 物理与宇宙学 ----------------
  "2":
    peel:
      - "牛顿三定律"
      - "牛顿第二"
      - "麦克斯韦方程组"
      - "薛定谔方程"
      - "洛伦兹变换"
      - "狭义相对论"      # 洛伦兹不变推论
      - "诺特定理"
      - "量子不可克隆"
      - "泡利不相容"      # 全同统计推论
      - "霍金辐射"
      - "黑洞无毛"
      - "兰姆位移"
      - "卡西米尔"
      - "热力学第一定律"  # 时间平移对称推论
      - "热力学第二定律"  # 定理(过去假说才是公设)
      - "热力学第三定律"
      - "细致平衡"
      - "自发对称性破缺"  # 机制,非公设
      - "纠缠"            # 张量积结构推论
      - "贝尔不等式"
      - "宇称"
      - "CPT"
      - "暗能量"          # 观测事实
      - "宇宙大爆炸"      # 历史推断
      - "宇宙学原理"      # 观测假设(可降级)
    must_cover:
      - "时空"
      - "等效原理"
      - "量子叠加"        # 线性
      - "不确定性"        # 非对易
      - "全同"            # 量子统计
      - "过去"            # 过去假说(低熵初始条件)
      - "最小作用量"
      - "规范"
    allow_incomplete: false

  # ---------------- L3 化学与分子科学 ----------------
  "3":
    peel:
      - "分子轨道"
      - "杂化"
      - "晶体场"
      - "质量作用定律"
      - "勒夏特列"
      - "酸碱质子"        # 定义
      - "吉布斯自由能"    # 热力学应用
      - "反应焓"
      - "熵变"
      - "电负性数值"      # 可从电离能+电子亲和能推导
      - "键能"            # 可测量
      - "电离能"
      - "化学振荡"
      - "耗散结构"
    must_cover:
      - "分子"
      - "化学键"
      - "周期"
      - "反应"
      - "活化"
      - "催化"
      - "手性"
      - "非共价"
      - "分子识别"
    allow_incomplete: true   # 化学层概念自治性强,初建期允许渐进

  # ---------------- L4 生物学与遗传学 ----------------
  "4":
    peel:
      - "孟德尔"
      - "哈迪"
      - "温伯格"
      - "分子钟"
      - "衰老"            # 选择强度衰减推论
      - "能量塔"
      - "十分之一定律"
      - "logistic"
      - "种间竞争排斥"    # Lotka-Volterra 推论
      - "手性均一"        # 历史偶然事实
      - "共同祖先"
      - "LUCA"
      - "生命起源"        # 历史推断
    must_cover:
      - "自创生"
      - "细胞"
      - "中心法则"
      - "遗传密码"
      - "突变"
      - "自然选择"
      - "漂变"
      - "复制"
      - "代谢"
      - "稳态"
      - "发育"
      - "免疫"
    allow_incomplete: false

  # ---------------- L5 神经科学与心理学 ----------------
  "5":
    peel:
      - "动作电位"        # 生物化学机制
      - "离子通道"
      - "突触传递"
      - "工作记忆容量"    # 测量事实
      - "七正负二"
      - "马斯洛"
      - "埃克曼"          # 分类
      - "镜像神经元"      # 具体发现
      - "海马"
      - "杏仁核"
      - "前额叶"          # 功能定位实例
      - "睡眠"
      - "生物钟"
      - "依恋"
      - "大五人格"
      - "精神分析"
    must_cover:
      - "感受质"          # 意识难题 — 本层唯一绝对不可还原项
      - "赫布"
      - "预测"
      - "注意"
      - "自我"
      - "意向"
    allow_incomplete: false

  # ---------------- L6 计算机与信息论 ----------------
  "6":
    peel:
      - "停机问题"        # 定理
      - "赖斯"
      - "兰道尔"          # 定理
      - "香农熵"          # 定义+定理
      - "信道编码"        # 定理
      - "霍夫曼"
      - "LDPC"
      - "冯诺依曼架构"    # 通用机推论
      - "通用图灵机"      # 定理
      - "自复制"          # 冯·诺依曼构造(定理)
      - "NP完全"
      - "图灵完备"
      - "布尔"            # L1 推论
      - "RSA"
      - "AES"
      - "加密"
      - "递归函数"        # 等价定义
      - "lambda"
    must_cover:
      - "丘奇"            # 论题(立法定义+猜想)
      - "可计算"          # 可计算性定义本身
      - "信息"            # 信息-实在二象性
      - "不可约"          # 计算不可约性
    allow_incomplete: false

  # ---------------- L7 经济学与博弈论 ----------------
  "7":
    peel:
      - "供求定律"
      - "均衡价格"
      - "帕累托"
      - "科斯定理"
      - "阿罗"            # 数学定理
      - "囚徒困境"        # 纳什均衡实例
      - "有效市场"        # 推论(已被证伪)
      - "货币数量论"
      - "菲利普斯"
      - "IS-LM"
      - "比较优势"        # 李嘉图模型内可证明
      - "边际效用递减"    # 习惯化推论
      - "前景理论"        # 认知偏差(属 L5)
      - "损失厌恶"
      - "禀赋效应"
    must_cover:
      - "稀缺"
      - "机会成本"
      - "激励"
      - "产权"
      - "价格"
      - "竞争"
      - "自发秩序"
      - "纳什"            # 均衡(定理但不可绕过)
      - "信息不对称"
      - "外部性"
      - "公共品"
      - "货币"
      - "奈特"            # 不确定性(补入条目)
    allow_incomplete: false

  # ---------------- L8 社会学与政治学 ----------------
  "8":
    peel:
      - "集体行动"        # 公共品推论
      - "委托代理"        # 信息不对称应用
      - "科尔曼"          # 方法论
      - "布迪厄"          # 交叉推论
      - "均势"            # 无政府推论
      - "威慑"
      - "安全困境"
      - "社会运动"        # 应用层
      - "革命"
      - "依附论"          # 理论流派
      - "世界体系"
      - "福柯"            # 理论视角
    must_cover:
      - "社会事实"        # 方法论押注但构成学科本体
      - "权力"
      - "合法性"
      - "规范"
      - "社会化"
      - "认同"
      - "信任"
      - "分层"
      - "网络"
      - "团结"
      - "冲突"
      - "国家"
      - "无政府"          # 国际体系
    allow_incomplete: false

  # ---------------- L9 工程学与控制论 ----------------
  "9":
    peel:
      - "PID"             # 方法
      - "传递函数"
      - "状态空间"
      - "李雅普诺夫"
      - "结构力学"
      - "材料强度"
      - "FMEA"            # 方法
      - "故障树"
      - "敏捷"            # 流程
      - "V模型"
      - "设计模式"        # 惯例
      - "OSI"
      - "数字孪生"
      - "项目管理"
      - "N-1准则"         # 实现
      - "三副本"
      - "S曲线"           # 经验模型
    must_cover:
      - "负反馈"
      - "可控"
      - "鲁棒"
      - "模块"
      - "权衡"
      - "尺度"
      - "失效"
      - "级联"
      - "人因"
      - "锁定"
    allow_incomplete: false

  # ---------------- L10 复杂系统与演化理论 ----------------
  "10":
    peel:
      - "逻辑斯蒂"        # 模型
      - "洛伦兹"          # 实例
      - "元胞自动机"      # 实例
      - "沙堆"            # 模型(假说)
      - "度分布"          # 度量工具
      - "集聚系数"
      - "介数"
      - "多主体仿真"      # 方法
      - "军备竞赛"        # 模型
      - "反脆弱"          # 通俗版本
      - "黑天鹅"
      - "小世界"          # 结构模式实例
      - "六度"
    must_cover:
      - "涌现"            # 层级涌现
      - "向下因果"
      - "自组织"
      - "临界"
      - "混沌"
      - "无标度"          # 网络(模式,非普适定律)
      - "多稳态"
      - "历史"            # 路径即结构
      - "适应性"          # CAS
      - "不可约预测"
      - "强涌现"
    allow_incomplete: false
